aid: pacto
name: Pacto
description: >-
  Pacto is a Mexican fintech company modernizing payment acquisition for banks
  and hospitality businesses, moving them "de lo legacy a lo digital" (from
  legacy to digital). Pacto builds point-of-sale (POS) software and payment
  terminals: a miniPOS terminal and "Ordena y Paga" (order-and-pay) terminals
  plus value-added modules for banks, and a full restaurant POS suite (Pacto
  POS, Pacto GetNet, Order & Pay QR ordering, bill splitting, inventory, and
  reporting) for restaurants, cafes, bars, and fast-food counters. Backed by 500
  Global and Banco Santander's GetNet, Pacto helps traditional financial
  institutions and merchants accept digital card payments and manage operations.
  This profile was surfaced as a 500 Global portfolio company; Pacto publishes a
  marketing site, blog, and pricing but no public developer API or documentation
  at this time.
